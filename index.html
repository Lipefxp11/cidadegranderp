<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cidade Grande — Lançamento Oficial</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #080202;
            color: #fff;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px 30px;
            background: rgba(10, 2, 2, 0.95);
            border-bottom: 1px solid rgba(255, 0, 0, 0.15);
        }

        .logo {
            font-weight: 900;
            font-size: 22px;
            letter-spacing: 2px;
            color: #ff1a1a;
            text-transform: uppercase;
        }

        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
            background: radial-gradient(circle at center, #260505 0%, #080202 70%);
        }

        .hero h1 {
            font-size: 40px;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .hero h1 span {
            color: #ff1a1a;
        }

        .hero p {
            color: #bfa3a3;
            font-size: 15px;
            max-width: 500px;
            margin: 0 auto 35px auto;
            line-height: 1.5;
        }

        .countdown-container {
            background: rgba(255, 0, 0, 0.05);
            border: 1px solid rgba(255, 0, 0, 0.3);
            border-radius: 16px;
            padding: 25px 35px;
            max-width: 450px;
            margin: 0 auto 40px auto;
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.15);
        }

        .countdown-title {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ff4d4d;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .countdown-timers {
            display: flex;
            justify-content: center;
            gap: 20px;
            font-weight: bold;
            font-size: 28px;
        }

        .timer-box span {
            display: block;
            font-size: 11px;
            color: #bfa3a3;
            font-weight: normal;
            margin-top: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 32px;
            border-radius: 30px;
            font-weight: bold;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 13px;
            transition: 0.2s;
        }

        .btn-primary {
            background: #ff1a1a;
            color: #fff;
            box-shadow: 0 0 20px rgba(255, 26, 26, 0.4);
        }

        .btn-primary:hover {
            background: #e60000;
        }

        footer {
            text-align: center;
            padding: 25px 20px;
            background: #040101;
            color: #734d4d;
            font-size: 12px;
            border-top: 1px solid rgba(255, 0, 0, 0.05);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Cidade Grande</div>
    </header>

    <section class="hero">
        <h1>O Grande <span>Lançamento</span></h1>
        <p>Prepare-se para viver a sua nova história. O servidor oficial da Cidade Grande está chegando com tudo.</p>
        
        <div class="countdown-container">
            <div class="countdown-title">Contagem Regressiva para o Lançamento</div>
            <div class="countdown-timers">
                <div class="timer-box"><strong id="days">00</strong><span>Dias</span></div>
                <div class="timer-box"><strong id="hours">00</strong><span>Horas</span></div>
                <div class="timer-box"><strong id="minutes">00</strong><span>Min</span></div>
                <div class="timer-box"><strong id="seconds">00</strong><span>Seg</span></div>
            </div>
        </div>

        <div class="btn-group">
            <a href="https://discord.gg" target="_blank" class="btn btn-primary">Entrar no Discord</a>
        </div>
    </section>

    <footer>
        <p>© 2026 Cidade Grande — Todos os direitos reservados.</p>
    </footer>

    <script>
        // Data alvo: 3 de Setembro de 2026 às 00:00:00
        const launchDate = new Date("September 3, 2026 00:00:00").getTime();

        function updateTimer() {
            const now = new Date().getTime();
            const gap = launchDate - now;

            if (gap < 0) {
                document.querySelector(".countdown-container").innerHTML = "<h3 style='color: #ff1a1a;'>SERVIDOR LANÇADO!</h3>";
                return;
            }

            const second = 1000;
            const minute = second * 60;
            const hour = minute * 60;
            const day = hour * 24;

            const d = Math.floor(gap / day);
            const h = Math.floor((gap % day) / hour);
            const m = Math.floor((gap % hour) / minute);
            const s = Math.floor((gap % minute) / second);

            document.getElementById("days").innerText = d < 10 ? "0" + d : d;
            document.getElementById("hours").innerText = h < 10 ? "0" + h : h;
            document.getElementById("minutes").innerText = m < 10 ? "0" + m : m;
            document.getElementById("seconds").innerText = s < 10 ? "0" + s : s;
        }

        setInterval(updateTimer, 1000);
        updateTimer();
    </script>
</body>
</html>
