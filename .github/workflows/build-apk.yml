name: Build BCG V019 Launcher

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Verify package, native libraries and source layout
        run: python3 scripts/verify_project.py

      - name: Build BCG APK
        run: ./gradlew --no-daemon clean assembleDebug lintDebug --stacktrace

      - name: APK info
        if: success()
        shell: bash
        run: |
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          ls -lh "$APK"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$APK" | head -n 3
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK" >/dev/null
          if unzip -Z1 "$APK" | grep '^lib/' | grep -v '^lib/arm64-v8a/'; then
            echo "APK contém ABI inesperado" >&2
            exit 1
          fi
          test -z "$(unzip -Z1 "$APK" | sort | uniq -d)"
          unzip -Z1 "$APK" | grep '^lib/arm64-v8a/' | sort
          TMP_LIBS="$(mktemp -d)"
          unzip -q "$APK" 'lib/*' -d "$TMP_LIBS"
          for SO in "$TMP_LIBS"/lib/arm64-v8a/*.so; do
            while read -r ALIGN; do
              (( ALIGN >= 0x4000 )) || { echo "$SO sem alinhamento de 16 KB" >&2; exit 1; }
            done < <("$ANDROID_SDK_ROOT/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -lW "$SO" \
              | awk '$1 == "LOAD" { print $NF }')
          done

      - name: Upload BCG APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BCG-V019-ANDROID-LAUNCHER-CEF-BASE
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
